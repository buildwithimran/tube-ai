<div class="relative min-h-dvh overflow-hidden px-5 pb-12 pt-16 sm:pt-24">
  <app-aurora-bg />
  <div class="mx-auto w-full max-w-sm text-center">
    <a routerLink="/" class="mb-8 inline-flex items-center justify-center gap-2 font-display text-xl font-bold">
      <span class="grid h-8 w-8 place-items-center rounded-xl bg-gradient-to-br from-brand-600 to-accent-500 text-white">T</span>
      TubeAi
    </a>
    <div class="card">
      <h1 class="font-display text-xl font-bold">Verify your email</h1>
      <p class="mt-1 text-sm text-neutral-600">
        We sent a 6-digit code to
        <span class="font-medium text-neutral-900">{{ auth.user()?.email }}</span>
      </p>

      <div class="mt-6">
        <app-otp-input (completed)="submit($event)" />
      </div>

      @if (error()) {
        <p class="mt-4 rounded-xl bg-rose-500/10 px-3 py-2 text-sm text-rose-600" role="alert">{{ error() }}</p>
      }
      @if (loading()) {
        <p class="mt-4 text-sm text-neutral-500">Verifying…</p>
      }

      <div class="mt-6 text-sm text-neutral-500">
        Didn't get it?
        @if (resending()) {
          <span>Sending…</span>
        } @else if (resendIn() > 0) {
          <span>Resend in {{ resendIn() }}s</span>
        } @else {
          <button type="button" (click)="resend()" class="font-semibold text-brand-600 hover:underline">Resend code</button>
        }
      </div>
    </div>

    <a routerLink="/app" class="mt-5 inline-block text-sm text-neutral-500 hover:text-neutral-700">Skip for now →</a>
  </div>
</div>
