<div class="relative min-h-dvh overflow-hidden px-5 pb-12 pt-16 sm:pt-24">
  <app-aurora-bg />
  <div class="mx-auto w-full max-w-sm">
    <a routerLink="/" class="mb-8 flex items-center justify-center gap-2 font-display text-xl font-bold">
      <span class="grid h-8 w-8 place-items-center rounded-xl bg-gradient-to-br from-brand-600 to-accent-500 text-white">T</span>
      TubeAi
    </a>
    <div class="card">
      <h1 class="font-display text-xl font-bold">Welcome back</h1>
      <p class="mt-1 text-sm text-neutral-600">Log in to your learning library.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4">
        <div>
          <label for="email" class="mb-1 block text-sm text-neutral-700">Email</label>
          <input id="email" type="email" formControlName="email" autocomplete="email" class="input" />
        </div>
        <div>
          <label for="password" class="mb-1 block text-sm text-neutral-700">Password</label>
          <div class="relative">
            <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
              autocomplete="current-password" class="input pr-11" />
            <button type="button" (click)="showPassword.set(!showPassword())"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword()"
              class="absolute inset-y-0 right-0 grid w-11 place-items-center text-neutral-400 transition hover:text-neutral-700 dark:hover:text-neutral-200">
              @if (showPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
          </div>
          <div class="mt-1.5 text-right">
            <a routerLink="/forgot-password" class="text-sm font-medium text-brand-600 hover:underline">Forgot password?</a>
          </div>
        </div>

        @if (error()) {
          <p class="rounded-xl bg-rose-500/10 px-3 py-2 text-sm text-rose-600" role="alert">{{ error() }}</p>
        }

        <button type="submit" [disabled]="loading()" class="btn btn-primary w-full py-2.5">
          {{ loading() ? 'Logging in…' : 'Log in' }}
        </button>
      </form>
    </div>
    <p class="mt-5 text-center text-sm text-neutral-600">
      New here?
      <a routerLink="/register" class="font-semibold text-brand-600 hover:underline">Create an account</a>
    </p>
  </div>
</div>
