<div class="mx-auto max-w-3xl">
  <h1 class="font-display text-2xl font-bold">Courses</h1>
  <p class="mt-1 text-neutral-500">Turn a YouTube playlist into a structured course.</p>

  <!-- Create -->
  <div class="card mt-6">
    <label for="pl" class="mb-2 flex items-center gap-2 text-sm font-medium">
      <lucide-icon name="youtube" class="h-4 w-4 text-brand-500"></lucide-icon> Playlist URL
    </label>
    <div class="flex flex-col gap-2 sm:flex-row">
      <input id="pl" type="url" [value]="url()" (input)="url.set($any($event.target).value)"
        (keyup.enter)="create()" [disabled]="creating()"
        placeholder="https://www.youtube.com/playlist?list=…" class="input min-w-0 flex-1" />
      <button type="button" class="btn btn-primary px-5" (click)="create()" [disabled]="creating() || !url()">
        @if (creating()) {
          <lucide-icon name="loader" class="h-4 w-4 animate-spin"></lucide-icon> Building…
        } @else {
          <lucide-icon name="sparkles" class="h-4 w-4"></lucide-icon> Build course
        }
      </button>
    </div>
  </div>

  <!-- List -->
  @if (loading()) {
    <div class="mt-6 grid gap-3 sm:grid-cols-2">
      @for (n of [1,2]; track n) { <div class="card h-28"></div> }
    </div>
  } @else if (courses().length === 0) {
    <div class="card mt-6">
      <app-empty-state icon="list-checks" title="No courses yet"
        message="Paste a playlist above to build your first course." />
    </div>
  } @else {
    <div class="mt-6 grid gap-3 sm:grid-cols-2">
      @for (c of courses(); track c._id) {
        <a [routerLink]="['/app/courses', c._id]"
          class="card group animate-fade-rise transition hover:-translate-y-0.5 hover:glow">
          <p class="font-display font-semibold">{{ c.title }}</p>
          <p class="mt-0.5 text-xs text-neutral-500">{{ c.lessons.length }} lessons</p>
          <div class="mt-3 h-2 overflow-hidden rounded-full bg-black/5 dark:bg-white/5">
            <div class="h-full rounded-full bg-gradient-to-r from-brand-500 to-accent-500" [style.width.%]="progress(c)"></div>
          </div>
          <p class="mt-1 text-xs text-neutral-500">{{ progress(c) }}% complete</p>
        </a>
      }
    </div>
  }
</div>
