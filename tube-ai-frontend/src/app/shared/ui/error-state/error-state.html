<div class="flex flex-col items-center rounded-2xl border border-rose-500/20 bg-rose-500/5 px-6 py-10 text-center">
  <div class="grid h-14 w-14 place-items-center rounded-2xl bg-rose-500/15 text-rose-400">
    <lucide-icon name="alert-circle" class="h-6 w-6"></lucide-icon>
  </div>
  <h3 class="mt-4 font-display text-base font-semibold">{{ title() }}</h3>
  <p class="mt-1 max-w-sm text-sm text-neutral-500">{{ message() }}</p>
  <button type="button" class="btn btn-ghost mt-5" (click)="retry.emit()">
    <lucide-icon name="refresh-cw" class="h-4 w-4"></lucide-icon>
    {{ retryLabel() }}
  </button>
</div>
