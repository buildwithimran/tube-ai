<div class="flex flex-col items-center px-6 py-12 text-center">
  <div class="grid h-16 w-16 place-items-center rounded-2xl bg-gradient-to-br from-brand-500/20 to-accent-500/20 text-brand-300">
    <lucide-icon [name]="icon()" class="h-7 w-7"></lucide-icon>
  </div>
  <h3 class="mt-4 font-display text-lg font-semibold">{{ title() }}</h3>
  @if (message()) {
    <p class="mt-1 max-w-sm text-sm text-neutral-500">{{ message() }}</p>
  }
  @if (cta()) {
    <button type="button" class="btn btn-primary mt-5" (click)="action.emit()">
      {{ cta() }}
    </button>
  }
</div>
