<div class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex flex-col items-center gap-2 px-4" aria-live="polite">
  @for (t of toasts.toasts(); track t.id) {
    <div [class]="toastClass(t.type)" role="status">
      <lucide-icon [name]="icon(t.type)" class="h-4 w-4 shrink-0"></lucide-icon>
      <span>{{ t.message }}</span>
    </div>
  }
</div>
